include: project.yml
name: SidecarBridgeFork

# Keep the author-owned project.yml and SidecarBridge.xcodeproj unchanged.
# This overlay is the only project definition used to build the fork apps.
settings:
  base:
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "122"

targets:
  SidecarBridgeMac:
    sources:REPLACE:
      - Shared
      - Mac
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift

  SidecarBridgeTests:
    sources:
      - ForkTests
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerView.swift
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift

  SidecarBridgeViewerMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac/Assets.xcassets
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputModeManager.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerView.swift
      - Mac/RemoteInputSourceController.swift
      - MacViewer/SidecarBridgeViewerMacApp.swift
      - Mac/PrivacyInfo.xcprivacy
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
    info:
      path: MacViewer/ViewerInfo.plist
      properties:
        CFBundleDisplayName: SidecarBridge Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge Viewer discovers selected Macs on your local network and connects to them over an encrypted link.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.viewer.mac
        PRODUCT_NAME: SidecarBridge Viewer
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacViewer/SidecarBridgeViewer.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.viewer.mac.debug
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework

  SidecarBridgeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SidecarBridgeViewerMac
    dependencies:
      - target: SidecarBridgeViewerMac

schemes:
  SidecarBridgeViewerUI:
    build:
      targets:
        SidecarBridgeViewerMac: all
        SidecarBridgeUITests: [test]
    test:
      config: Debug
      targets:
        - SidecarBridgeUITests
  SidecarBridgeViewerMac:
    build:
      targets:
        SidecarBridgeViewerMac: all
    run:
      config: Debug
