name: SidecarBridge
options:
  bundleIdPrefix: io.sidecarbridge
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    # macOS build 117 separates the Viewer into its own macOS app.
    CURRENT_PROJECT_VERSION: "117"
    DEVELOPMENT_TEAM: LYK4LV2859
targets:
  SidecarBridgeMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: SidecarBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge advertises an encrypted local display service and accepts connections from the Viewer app you choose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.mac
        PRODUCT_NAME: SidecarBridge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Mac/SidecarBridgeMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Accessibility/TCC must identify the real app executable, not Xcode's
        # debug-dylib launcher arrangement.
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: ServiceManagement.framework
      - sdk: Network.framework
      - sdk: VideoToolbox.framework
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
      - sdk: Carbon.framework

  SidecarBridgeViewerMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac/Assets.xcassets
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputModeManager.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerView.swift
      - Mac/RemoteInputSourceController.swift
      - MacViewer/SidecarBridgeViewerMacApp.swift
      - Mac/PrivacyInfo.xcprivacy
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
    info:
      path: MacViewer/ViewerInfo.plist
      properties:
        CFBundleDisplayName: SidecarBridge Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge Viewer discovers selected Macs on your local network and connects to them over an encrypted link.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.viewer.mac
        PRODUCT_NAME: SidecarBridge Viewer
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacViewer/SidecarBridgeViewer.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework

  SidecarBridgePad:
    type: application
    platform: iOS
    sources:
      - Shared
      - Pad
    info:
      path: Pad/Info.plist
      properties:
        CFBundleDisplayName: SidecarBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge finds your Mac and receives its screen over your local network.
        NSCameraUsageDescription: Scan the temporary pairing QR code displayed by SidecarBridge on your Mac. Images are not saved or uploaded.
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        # Required for actual user-visible AVKit Picture in Picture video.
        # No silent-audio keepalive; see FRAME_INTERPOLATION_AND_BACKGROUND.md.
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneClassName: UIWindowScene
                UISceneConfigurationName: Default Configuration
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.mac
        PRODUCT_NAME: SidecarBridge
        MARKETING_VERSION: "1.4"
        # iOS/iPadOS 1.4 build 6 adds the Developer FPS history graph.
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: MultipeerConnectivity.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: VideoToolbox.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: VisionKit.framework
      - sdk: Security.framework

  SidecarBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Pad/MacScreenSharingSession.swift
      - Mac/SidecarConnector.swift
      - Mac/PairingQRCodeView.swift
      - Mac/MacPairingCard.swift
      - Mac/MacDeviceAuthorization.swift
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerView.swift
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
      - Pad/RemoteKeyboardToolbar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Security.framework

  SidecarBridgeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SidecarBridgeViewerMac
    dependencies:
      - target: SidecarBridgeViewerMac

schemes:
  SidecarBridgeViewerUI:
    build:
      targets:
        SidecarBridgeViewerMac: all
        SidecarBridgeUITests: [test]
    test:
      config: Debug
      targets:
        - SidecarBridgeUITests
  SidecarBridgeViewerMac:
    build:
      targets:
        SidecarBridgeViewerMac: all
    run:
      config: Debug
  SidecarBridgeMac:
    build:
      targets:
        SidecarBridgeMac: all
        SidecarBridgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SidecarBridgeTests
  SidecarBridgePad:
    build:
      targets:
        SidecarBridgePad: all
    run:
      config: Debug
