include: project.yml
name: SidecarBridgeFork

# Keep the author-owned project.yml and SidecarBridge.xcodeproj unchanged.
# This overlay is the only project definition used to build the fork apps.
settings:
  base:
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "127"

targets:
  SidecarBridgeMac:
    sources:REPLACE:
      - Shared
      - path: Mac
        excludes:
          - Info.plist
          - Assets.xcassets
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
      - Fork/Runtime
      - Fork/Resources/ScreenDockAssets.xcassets
      - path: Fork/Host
        optional: true
    info:REPLACE:
      path: Fork/Resources/HostInfo.plist
      properties:
        CFBundleDisplayName: ScreenDock Host
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
          - _sd-screen._tcp
          - _sd-direct._tcp
        NSLocalNetworkUsageDescription: ScreenDock Host accepts encrypted local display connections from ScreenDock Viewer and compatible SidecarBridge iPhone and iPad apps.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screendock.host
        PRODUCT_NAME: ScreenDock Host
        ASSETCATALOG_COMPILER_APPICON_NAME: ScreenDockAppIcon
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "127"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SIDECARBRIDGE_FORK"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.screendock.host.debug

  SidecarBridgeTests:
    sources:
      - ForkTests
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerView.swift
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
      - Fork/Runtime
      - path: Fork/Host
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screendock.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SIDECARBRIDGE_FORK SIDECARBRIDGE_TESTING"

  SidecarBridgeViewerMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Fork/Resources/ScreenDockAssets.xcassets
      - MacViewer/MacViewerConnectionModel.swift
      - MacViewer/MacViewerInputModeManager.swift
      - MacViewer/MacViewerInputSurface.swift
      - MacViewer/MacViewerPresentation.swift
      - MacViewer/MacViewerVideoDisplay.swift
      - MacViewer/MacViewerView.swift
      - Mac/RemoteInputSourceController.swift
      - MacViewer/SidecarBridgeViewerMacApp.swift
      - Mac/PrivacyInfo.xcprivacy
      - Pad/PadDeviceIdentity.swift
      - Pad/PadLANService.swift
      - Pad/PadPeerService.swift
      - Fork/Runtime
    info:
      path: Fork/Resources/ViewerInfo.plist
      properties:
        CFBundleDisplayName: ScreenDock Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sd-screen._tcp
          - _sd-direct._tcp
        NSLocalNetworkUsageDescription: ScreenDock Viewer discovers compatible ScreenDock Hosts on your local network and connects to them over an encrypted link.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screendock.viewer
        PRODUCT_NAME: ScreenDock Viewer
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "127"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SIDECARBRIDGE_FORK"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacViewer/SidecarBridgeViewer.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ScreenDockAppIcon
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.screendock.viewer.debug
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework

  SidecarBridgeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screendock.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SidecarBridgeViewerMac
    dependencies:
      - target: SidecarBridgeViewerMac

  SidecarBridgePad:
    settings:
      base:
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "6"

schemes:
  SidecarBridgeViewerUI:
    build:
      targets:
        SidecarBridgeViewerMac: all
        SidecarBridgeUITests: [test]
    test:
      config: Debug
      targets:
        - SidecarBridgeUITests
  SidecarBridgeViewerMac:
    build:
      targets:
        SidecarBridgeViewerMac: all
    run:
      config: Debug
