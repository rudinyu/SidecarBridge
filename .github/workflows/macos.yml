name: macOS

on:
  pull_request:
    paths:
      - ".codex/ci.sh"
      - ".github/workflows/macos.yml"
      - "docs/MACOS_DUAL_MAC_ACCEPTANCE.md"
      - "docs/UPSTREAM_SYNC.md"
      - "Mac/**"
      - "MacViewer/**"
      - "Pad/**"
      - "Shared/**"
      - "Tests/**"
      - "ForkTests/**"
      - "Fork/**"
      - "UITests/**"
      - "project.yml"
      - "project.fork.yml"
      - "SidecarBridge.xcodeproj/**"
      - "scripts/**"
      - "README.md"
  push:
    paths:
      - ".codex/ci.sh"
      - ".github/workflows/macos.yml"
      - "docs/MACOS_DUAL_MAC_ACCEPTANCE.md"
      - "docs/UPSTREAM_SYNC.md"
      - "Mac/**"
      - "MacViewer/**"
      - "Pad/**"
      - "Shared/**"
      - "Tests/**"
      - "ForkTests/**"
      - "Fork/**"
      - "UITests/**"
      - "project.yml"
      - "project.fork.yml"
      - "SidecarBridge.xcodeproj/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c
          mkdir -p .build/Tools/XcodeGen
          unzip -q "$archive" -d .build/Tools/XcodeGen
          .build/Tools/XcodeGen/xcodegen/bin/xcodegen --version
      - name: Run macOS tests and Release builds
        env:
          XCODEGEN_BIN: .build/Tools/XcodeGen/xcodegen/bin/xcodegen
        run: bash .codex/ci.sh
